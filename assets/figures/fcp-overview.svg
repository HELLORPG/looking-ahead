<svg xmlns="http://www.w3.org/2000/svg" class="method-diagram" viewBox="44 4 1188 504" role="img" aria-labelledby="fcp-title fcp-description">
  <title id="fcp-title">Future Chunk Prediction architecture</title>
  <desc id="fcp-description">Web drawing based on the paper overview. Clean historical chunks and the current chunk enter the autoregressive Transformer. The current input f_t has a solid left-half and dashed right-half border to indicate use as both a clean latent and a noisy latent. Intermediate hidden state h_t conditions three independent Transformer predictors. Each predictor denoises its own noisy future latent to predict f_t+1, f_t+2, or f_t+3. The predictors do not pass information to one another.</desc>
  <defs>
    <marker id="fcp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#9fc6ed"/></marker>
    <marker id="fcp-feature-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#9fc6ed"/></marker>
    <marker id="fcp-main-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#b1bdcb"/></marker>
  </defs>
  <style>
    .fcp-label{font:500 16px Arial,sans-serif;letter-spacing:1.6px;fill:#c3c6cc}
    .fcp-label.fcp-future-heading{fill:#9fc6ed}
    .fcp-block-label{font:500 22px Arial,sans-serif;fill:#f1eee7}
    .fcp-math{font:italic 28px Georgia,serif;fill:#f1eee7;text-anchor:middle}
    .fcp-latent-math{fill:#23364d}
    .fcp-sub{font-size:17px}
    .fcp-note{font:500 13px Arial,sans-serif;fill:#c3c6cc}
    .fcp-route{fill:none;stroke:#9fc6ed;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .fcp-feature-route{fill:none;stroke:#9fc6ed;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .fcp-main-route{fill:none;stroke:#b1bdcb;stroke-width:2.6;marker-end:url(#fcp-main-arrow)}
    .fcp-legend .fcp-note{font-size:18px}
    .fcp-legend .fcp-label{font-size:14px;letter-spacing:1.4px}
  </style>
